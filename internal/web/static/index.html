<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>labnet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>labnet</h1>
  <div id="summary">connecting…</div>
</header>

<nav id="tabs">
  <button class="tab-btn active" data-tab="services">Services</button>
  <button class="tab-btn" data-tab="journal">Journal</button>
</nav>

<main>

<section id="tab-services" class="tab active">
  <h2>Services</h2>
  <table id="services-table"><thead><tr><th>Name</th><th>Host</th><th>Target</th></tr></thead><tbody></tbody></table>

  <form id="expose-form">
    <h3>Expose</h3>
    <input name="name" required placeholder="name">
    <input name="target" required placeholder="http://127.0.0.1:5173">
    <input name="host" placeholder="host (optional)">
    <button type="submit">Expose</button>
    <div class="result"></div>
  </form>

  <form id="up-form">
    <h3>Up (Dockerfile)</h3>
    <input name="name" required placeholder="name">
    <input name="dir" required placeholder="/path/to/project">
    <button type="submit">Up</button>
    <div class="result"></div>
  </form>
</section>

<section id="tab-journal" class="tab">
  <h2>Journal</h2>
  <form id="query-form" class="inline-form">
    <select name="schema">
      <option value="DnsQuery">DnsQuery</option>
      <option value="HttpRequest">HttpRequest</option>
    </select>
    <input name="predicate" placeholder='e.g. blocked  or  status &gt;= 400' size="40">
    <input name="limit" type="number" placeholder="limit" size="4" style="width:5em">
    <button type="submit">Run query</button>
  </form>
  <div id="query-stats"></div>
  <div id="query-results"></div>

  <h3>Policy</h3>
  <p>Filters named <code>deny_</code>/<code>allow_</code> act on HttpRequest, <code>block_</code> on DnsQuery.</p>
  <textarea id="policy-source" spellcheck="false" rows="12"></textarea>
  <div>
    <button id="policy-check-btn">Check</button>
    <button id="policy-test-btn">Test</button>
    <button id="policy-apply-btn">Apply</button>
  </div>
  <pre id="policy-result"></pre>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
